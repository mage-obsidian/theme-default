name: verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: informative reports, gate fails the run
        type: choice
        options: [informative, gate]
        default: informative

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - run: pnpm install --frozen-lockfile

      # The checks that drive a storefront report themselves as not executed
      # when none answers, rather than passing on an environment that could not
      # observe anything. Point E2E_BASE_URL at a seeded environment to run them.
      - name: verify
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
        run: pnpm run ${{ inputs.mode == 'gate' && 'verify:gate' || 'verify' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification
          path: |
            tests/e2e/.artifacts/verification.json
            tests/e2e/.artifacts/run-summary.json
            tests/e2e/playwright-report
